# Kafka (KRaft, single node) + Jupyter PySpark, adapted from the course lab
# 05.structured-streaming/lab_docker_wikistreams.
# The PySpark image is pinned by digest (Spark 4.2.0, Scala 2.13) so that
# the project runs identically from scratch.

services:
  kafka:
    image: apache/kafka-native:4.1.1
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - kafka-spark-net

  pyspark-notebook:
    image: quay.io/jupyter/pyspark-notebook@sha256:7e102d041c42cca6e0d32269cded10fad2c377aeb09fad1ec546840660d691c4
    container_name: pyspark_notebook
    user: root
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
    environment:
      - NB_UID=${UID:-1000}
      - NB_GID=${GID:-1000}
      - CHOWN_EXTRA=/home/jovyan/work,/home/jovyan/jobs,/home/jovyan/data
      - CHOWN_EXTRA_OPTS=-R
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./jobs:/home/jovyan/jobs
      - ./data:/home/jovyan/data
    networks:
      - kafka-spark-net
    depends_on:
      - kafka

  # Wikipedia -> Kafka producer. It only starts when called explicitly:
  # docker compose run --rm producer --minutes 30
  producer:
    build: ./producer
    container_name: wiki_producer
    profiles:
      - streaming
    networks:
      - kafka-spark-net
    depends_on:
      - kafka

networks:
  kafka-spark-net:
    driver: bridge
